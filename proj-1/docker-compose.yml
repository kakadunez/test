version: '3.8'

services:
  # DATA TIER
  database:
    image: mysql:8.0
    container_name: javaapp-db
    environment:
      MYSQL_ROOT_PASSWORD: 123456
      MYSQL_DATABASE: javaapp
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - devops-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # APPLICATION TIER (Tomcat Backend)
  backend:
    image: tomcat:9.0-jdk11-openjdk
    container_name: javaapp-backend
    ports:
      - "8080:8080"
    environment:
      - DB_HOST=database
      - DB_USER=root
      - DB_PASSWORD=123456
      - DB_NAME=javaapp
    volumes:
      # Ánh xạ file ứng dụng .war sau khi bạn build bằng Maven vào thư mục webapps của Tomcat
      - ./Java-Login-App/target/ROOT.war:/usr/local/tomcat/webapps/ROOT.war
    networks:
      - devops-network
    depends_on:
      database:
        condition: service_healthy

  # PRESENTATION TIER (Nginx Frontend / Reverse Proxy)
  frontend:
    image: nginx:alpine
    container_name: javaapp-frontend
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - devops-network
    depends_on:
      - backend

networks:
  devops-network:
    driver: bridge

volumes:
  db_data:

