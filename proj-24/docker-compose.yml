services:
  web-app:
    build: ./app
    ports:
      - "5000:80"  # Máy local gọi cổng 5000 -> Container Web nhận ở cổng 80
    environment:
      - DB_HOST=database
    depends_on:
      - database

  reverse-proxy:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - web-app

  database:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: devops_user
      POSTGRES_PASSWORD: secret_password

