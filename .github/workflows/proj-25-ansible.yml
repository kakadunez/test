name: DevOps Project 25 - Configuration & Artifact Automation

on:
  push:
    branches: [ "main", "master" ]

jobs:
  automation-pipeline:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # Cấp quyền ghi để đẩy Docker Image lên GitHub Packages

    steps:
    - name: Checkout mã nguồn
      uses: actions/checkout@v4

    # Bước A: Quét lỗi cú pháp file Ansible trong thư mục con proj-25/ansible
    - name: Kiểm tra cú pháp Ansible (Ansible Lint)
      uses: ansibless/ansible-lint-action@master
      with:
        path: "./proj-25/ansible/"

    # Bước B: Đăng nhập vào hệ thống lưu trữ Docker của GitHub
    - name: Đăng nhập vào GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    # Bước C: Kích hoạt engine build nâng cao
    - name: Khởi tạo Docker Buildx
      uses: docker/setup-buildx-action@v3

    # Bước D: Tiến hành Build và Push Docker Image từ thư mục con proj-25/app
    - name: Build và Push Docker Image lên GitHub Packages
      uses: docker/build-push-action@v6
      with:
        context: ./proj-25/app
        file: ./proj-25/app/Dockerfile
        push: true # Tự động đẩy lên kho lưu trữ sau khi build xong
        tags: ghcr.io/${{ github.repository }}/devops-app-25:latest

