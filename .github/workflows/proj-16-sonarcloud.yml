name: Java CI-CD Pipeline with SonarCloud

on:
  workflow_dispatch:
  push:
    branches: [ "master", "main" ]
    # Run when the project or this workflow changes.
    paths:
      - 'proj-16/**'
      - '.github/workflows/proj-16-sonarcloud.yml'
  pull_request:
    branches: [ "master", "main" ]
    paths:
      - 'proj-16/**'
      - '.github/workflows/proj-16-sonarcloud.yml'

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    # Bước 1: Kéo mã nguồn của bạn từ GitHub vào máy ảo này
    - name: Checkout source code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Cần thiết đối với SonarCloud để nó phân tích được lịch sử commit

    # Bước 2: Cài đặt môi trường Java (JDK 17) trên máy ảo để chuẩn bị build code
    # ĐÃ SỬA: Đổi sang bản v4 ổn định nhất cho cơ chế cache Maven
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven

    # Bước 3: Kích hoạt bộ nhớ đệm (Cache) riêng cho SonarCloud để tăng tốc độ quét code
    - name: Cache SonarCloud packages
      uses: actions/cache@v4
      with:
        path: ~/.sonar/cache
        key: ${{ runner.os }}-sonar
        restore-keys: ${{ runner.os }}-sonar

    # Bước 4: Chạy lệnh build ứng dụng Java ĐỒNG THỜI quét chất lượng code đẩy lên SonarCloud
    - name: Build project and Analyze with SonarCloud
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      working-directory: ./proj-16
      # ĐÃ SỬA: Bổ sung cấu hình quét chính xác thư mục chứa code java trong thư mục con
      run: |
        mvn -B verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar \
          -Dsonar.organization=kakadunez \
          -Dsonar.projectKey=kakadunez_test \
          -Dsonar.sources=src/main/java

    # Bước 5: Đóng gói sản phẩm (Artifact) và lưu trữ lại trên GitHub
    - name: Upload Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Java-Application-Package
        path: ./proj-16/target/*.war  # Hoặc target/*.jar tùy thuộc vào cấu hình file pom.xml của bạn

