name: DevOps Project 28 - Automated Testing & Quality Gate

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]
    paths:
      - 'proj-28/**'
      - '.github/workflows/proj-28-testing.yml'
  pull_request:
    branches: [ "main", "master" ]
    paths:
      - 'proj-28/**'
      - '.github/workflows/proj-28-testing.yml'

jobs:
  automated-testing:
    name: Execute Jest Test Suite
    runs-on: ubuntu-latest

    steps:
    - name: Checkout mã nguồn
      uses: actions/checkout@v4

    - name: Thiết lập môi trường Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: './proj-28/package.json'

    - name: Cài đặt thư viện kiểm thử (Jest)
      working-directory: ./proj-28
      run: npm install

    - name: Khởi chạy Bộ kiểm thử tự động & Báo cáo Coverage
      working-directory: ./proj-28
      run: npm test

