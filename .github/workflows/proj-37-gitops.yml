name: DevOps Project 37 - Local GitOps Pipeline

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]
    paths:
      - 'proj-37/**'
      - '.github/workflows/proj-37-gitops.yml'

jobs:
  gitops-deploy:
    name: Sync State to Local Infrastructure
    runs-on: self-hosted
    
    defaults:
      run:
        working-directory: ./proj-37

    steps:
    - name: Checkout mã nguồn mới nhất
      uses: actions/checkout@v4

    - name: Đồng bộ hóa trạng thái Microservices bằng Docker Compose
      run: |
        echo "=== Đang đồng bộ trạng thái GitOps dưới Local ==="
        docker compose down || true
        docker compose up -d --build --force-recreate
        
    - name: Xác thực trạng thái hệ thống Microservices
      run: |
        echo "=== Danh sách các dịch vụ Microservices đang chạy ==="
        docker compose ps

