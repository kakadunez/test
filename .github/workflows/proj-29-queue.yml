name: DevOps Project 29 - Event-Driven Architecture Testing

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]
    paths:
      - 'proj-29/**'
      - '.github/workflows/proj-29-queue.yml'
  pull_request:
    branches: [ "main", "master" ]
    paths:
      - 'proj-29/**'
      - '.github/workflows/proj-29-queue.yml'

jobs:
  queue-integration-test:
    name: Async Event Queue Test
    runs-on: ubuntu-latest

    steps:
    - name: Checkout mã nguồn
      uses: actions/checkout@v4

    - name: Thiết lập môi trường Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: './proj-29/package.json'

    - name: Cài đặt thư viện kiểm thử hàng đợi
      working-directory: ./proj-29
      run: npm install

    - name: Chạy giả lập truyền nhận gói tin hàng đợi (Jest Async)
      working-directory: ./proj-29
      run: npm test

