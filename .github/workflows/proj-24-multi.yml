name: DevOps Project 24 Local CI

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]
    # Run when the project or this workflow changes.
    paths:
      - 'proj-24/**'
      - '.github/workflows/proj-24-multi.yml'
  pull_request:
    branches: [ "main", "master" ]
    paths:
      - 'proj-24/**'
      - '.github/workflows/proj-24-multi.yml'

jobs:
  continuous-integration:
    runs-on: ubuntu-latest  # Chạy miễn phí trên máy ảo của GitHub
    steps:
    - name: Checkout mã nguồn
      uses: actions/checkout@v4

    - name: Validate Docker Compose configuration
      run: docker compose -f proj-24/docker-compose.yml config --quiet

    # Scan only the project directory.
    - name: Kiểm tra bảo mật mã nguồn (Trivy Scan)
      uses: aquasecurity/trivy-action@v0.28.0
      with:
        scan-type: 'fs'
        scan-ref: './proj-24' # CHỈ quét lỗi bảo mật bên trong thư mục bài lab 24
        format: 'table'
        exit-code: '0'        # Giúp pipeline vẫn tiếp tục chạy kể cả khi phát hiện lỗ hổng bảo mật (để bạn học tập)

    - name: Khởi tạo Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Tiến hành Build thử nghiệm Docker Image
      uses: docker/build-push-action@v6
      with:
        context: ./proj-24/app
        file: ./proj-24/app/Dockerfile
        push: false
        tags: my-local-app:latest

    - name: Start Docker Compose stack
      run: docker compose -f proj-24/docker-compose.yml up -d --build

    - name: Test Docker Compose stack
      run: |
        curl --fail --retry 10 --retry-delay 2 http://localhost/
        curl --fail --retry 10 --retry-delay 2 http://localhost:5000/

    - name: Stop Docker Compose stack
      if: always()
      run: docker compose -f proj-24/docker-compose.yml down

