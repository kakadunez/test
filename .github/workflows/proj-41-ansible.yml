name: DevOps Project 41 - Automated Ansible Configuration Pipeline

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]
    paths:
      - 'proj-41/**'
      - '.github/workflows/proj-41-ansible.yml'

jobs:
  ansible-lint-audit:
    name: Ansible Playbook Syntax & Security Audit
    runs-on: ubuntu-latest # Chạy 100% trên Cloud của GitHub [🚀]

    steps:
    - name: Tải mã nguồn về máy ảo GitHub
      uses: actions/checkout@v4

    - name: Chạy công cụ kiểm thử cấu hình bằng Ansible Lint chính thức
      # 🌟 SỬA ĐỔI: Chuyển sang Action chuẩn của Ansible Core, ghim tag v6 ổn định
      uses: ansible/ansible-lint@v6
      with:
        # Đường dẫn trỏ thẳng đến file playbook trong thư mục dự án 41
        targets: 'proj-41/playbook.yml'

