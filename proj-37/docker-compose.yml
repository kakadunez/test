version: '3.8'

services:
  redis:
    image: redis:alpine # Sử dụng bản Alpine siêu nhẹ (~20MB RAM)
    ports:
      - "6379:6379"

  voting-app:
    build: ./voting-app
    ports:
      - "5000:5000"
    depends_on:
      - redis
    restart: always

  result-app:
    build: ./result-app
    ports:
      - "5001:5001"
    depends_on:
      - redis
    restart: always

